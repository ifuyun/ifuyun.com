@let w = wallpaper();
<lib-breadcrumb/>
@if (w) {
  <div class="post" [class.p-post]="!isMobile" [class.m-post]="isMobile">
    <header class="post-header">
      <h1 class="post-title">
        <a routerLink="."
           [queryParams]="langParams()"
           [title]="w.copyright"
           rel="bookmark">{{ w.copyright }}</a>
      </h1>
      <div class="post-meta post-meta-top">
        <span title="日期: {{ w.bingDate | date: 'yyyy-MM-dd' }}">
          <fi-calendar-date class="fi"/><span>{{ w.bingDate | date: 'yyyy-MM-dd' }}</span>
        </span>
        <span title="拼图：{{ w.wallpaperStat.playCount | numberView: 'K' }}">
          <nz-icon nzType="product"/><span>{{ w.wallpaperStat.playCount | numberView: 'K' }}</span>
        </span>
      </div>
    </header>
    <div class="divider"></div>
    <div class="jigsaw-body">
      <lib-jigsaw/>
    </div>
    <footer class="post-footer">
      <div class="post-actions">
        <div>
          <button class="button-like" [class.liked]="w.isVoted" (click)="vote()">
            <nz-icon nzType="like" nzTheme="fill"/>
            <span class="text">真棒！{{ w.wallpaperStat.likeCount > 0 ? w.wallpaperStat.likeCount : '' }}</span>
            <span class="parkinson-mask"><nz-icon nzType="like" nzTheme="fill"/></span>
          </button>
          <button (click)="showReward()" title="打赏"><nz-icon nzType="heart" nzTheme="fill"/></button>
          <button [class.liked]="w.isFavorite"
                  (click)="addFavorite()"
                  [title]="w.isFavorite ? '已收藏' : '收藏'"><nz-icon nzType="star" nzTheme="fill"/></button>
          @if (!isMobile) {
            <button (click)="showShareQrcode()" title="分享"><fi-share-fill/></button>
          }
        </div>
      </div>
    </footer>
    <lib-wallpaper-prev-next [jigsaw]="true" [lang]="lang()"/>
  </div>
  <lib-wallpaper-related [jigsaw]="true" [lang]="lang()"/>
  <lib-make-money/>
  <lib-comment [targetType]="commentType"/>
  @if (shareVisible()) {
    <lib-share-modal [shareUrl]="shareUrl()" (close)="closeShareQrcode()"/>
  }
}
