<lib-breadcrumb/>
@if (total() > 0) {
  <div [class.post-list]="!isMobile" [class.m-post-list]="isMobile">
    @for (post of posts(); track post.id; let i = $index) {
      <lib-post-item [post]="post" [index]="i"/>
    }
  </div>
} @else {
  <div class="empty" [class.p-empty]="!isMobile" [class.m-empty]="isMobile">
    <nz-empty nzNotFoundImage="simple"/>
  </div>
}
<lib-make-money/>
<lib-pagination [page]="page()" [total]="total()" [pageSize]="pageSize()" [url]="paginationUrl()"/>
